<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Project Estimation</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      font-family: 'Inter', sans-serif;
    }

    .navbar {
      border-bottom: 1px solid #e5e7eb;
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 1.3rem;
    }

    .card {
      border-radius: 16px;
      border: none;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }

    h5, h6 {
      font-weight: 600;
    }

    .muted {
      color: #6b7280;
      font-size: 0.9rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #374151;
    }

    input.form-control {
      border-radius: 10px;
      font-size: 0.9rem;
      padding: 10px;
    }

    input.form-control:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 0.15rem rgba(99,102,241,.25);
    }

    .btn {
      border-radius: 10px;
      font-weight: 500;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
    }

    .btn-success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
    }

    .result-box {
      background: #f9fafb;
      border-left: 4px solid #6366f1;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .spinner {
      display: none;
    }

    footer {
      font-size: 0.85rem;
      color: #6b7280;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-light bg-white mb-4">
  <div class="container">
    <span class="navbar-brand">Project Estimation Platform</span>
    <span class="muted d-none d-md-block">AI-Driven Effort & Cost Estimation</span>
  </div>
</nav>

<main class="container mb-5">
  <div class="row g-4">

    <!-- Effort Prediction -->
    <div class="col-lg-6">
      <div class="card p-4">
        <h5>Predict Project Effort (Hours)</h5>
        <p class="muted mb-3">Enter project attributes to estimate development effort.</p>

        <div class="row g-2">
          <div class="col-6"><label>Project</label><input class="form-control" id="Project" value="10"></div>
          <div class="col-6"><label>Manager Experience</label><input class="form-control" id="ManagerExp" value="5"></div>
          <div class="col-6 mt-2"><label>Year End</label><input class="form-control" id="YearEnd" value="2023"></div>
          <div class="col-6 mt-2"><label>Project Length (months)</label><input class="form-control" id="Length" value="12"></div>
          <div class="col-6 mt-2"><label>Transactions</label><input class="form-control" id="Transactions" value="200"></div>
          <div class="col-6 mt-2"><label>Entities</label><input class="form-control" id="Entities" value="10"></div>
          <div class="col-6 mt-2"><label>Unadjusted FP</label><input class="form-control" id="PointsNonAdjust" value="50"></div>
          <div class="col-6 mt-2"><label>Adjustment Factor</label><input class="form-control" id="Adjustment" value="1"></div>
          <div class="col-6 mt-2"><label>Adjusted FP</label><input class="form-control" id="PointsAjust" value="55"></div>
          <div class="col-6 mt-2"><label>Language Category</label><input class="form-control" id="Language" value="1"></div>
        </div>

        <div class="d-flex align-items-center gap-2 mt-4">
          <button class="btn btn-primary" id="predictBtn">Predict Effort</button>
          <button class="btn btn-outline-secondary" id="clearBtn">Clear</button>
          <div class="spinner-border text-primary spinner" id="spinner"></div>
        </div>

        <div class="mt-4" id="predictResult"></div>
      </div>
    </div>

    <!-- Cost Estimation -->
    <div class="col-lg-6">
      <div class="card p-4">
        <h5>Analogous Cost Estimation</h5>
        <p class="muted">Estimate cost using historical project similarity.</p>

        <div class="input-group mt-3">
          <input id="size" class="form-control" value="1200">
          <button class="btn btn-success" id="analogousBtn">Estimate Cost</button>
        </div>

        <div class="mt-4" id="analogousResult"></div>
      </div>
    </div>

  </div>
</main>

<footer class="text-center">
  <div>© Project Estimation System • FastAPI • Random Forest • SQLite</div>
</footer>

<script>
const baseUrl = 'http://127.0.0.1:8000';

function showSpinner(show=true){
  document.getElementById('spinner').style.display = show ? 'inline-block' : 'none';
}

predictBtn.onclick = async () => {
  showSpinner(true);
  predictResult.innerHTML = "";

  const features = {
    Project: +Project.value,
    ManagerExp: +ManagerExp.value,
    YearEnd: +YearEnd.value,
    Length: +Length.value,
    Transactions: +Transactions.value,
    Entities: +Entities.value,
    PointsNonAdjust: +PointsNonAdjust.value,
    Adjustment: +Adjustment.value,
    PointsAjust: +PointsAjust.value,
    Language: Language.value
  };

  try {
    const res = await fetch(baseUrl + '/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ features })
    });

    if (!res.ok) throw new Error("Prediction failed");

    const data = await res.json();

    if (data.estimated_effort_hours === undefined) {
      throw new Error("Invalid response");
    }

    predictResult.innerHTML = `
      <div class="result-box">
        <b>Estimated Development Effort</b><br>
        ${data.estimated_effort_hours} hours
      </div>`;
  } catch (e) {
    predictResult.innerHTML = `<div class="text-danger">Unable to predict effort. Please check backend.</div>`;
  } finally {
    showSpinner(false);
  }
};

analogousBtn.onclick = async () => {
  analogousResult.innerHTML = "";
  try {
    const res = await fetch(baseUrl + '/analogous', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ size: +size.value })
    });

    if (!res.ok) throw new Error();

    const d = await res.json();

    analogousResult.innerHTML = `
      <div class="result-box">
        <p><b>Base Cost:</b> ₹ ${d.base_cost}</p>
        <p><b>Cost Range:</b> ₹ ${d.cost_range.min} – ${d.cost_range.max}</p>
        <p><b>Recommended Bid:</b> ₹ ${d.recommended_bid}</p>
        <p><b>Risk Level:</b> ${d.risk_level}</p>
      </div>`;
  } catch {
    analogousResult.innerHTML = `<div class="text-danger">Unable to estimate cost.</div>`;
  }
};

clearBtn.onclick = () => predictResult.innerHTML = "";
</script>

</body>
</html>
